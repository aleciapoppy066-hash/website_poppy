<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri - Fotografi Sederhana</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <div class="container">
      <div class="brand">
        <h1>Fotografi Sederhana</h1>
        <span class="meta">Galeri</span>
      </div>

      <nav class="navbar" aria-label="Navigasi utama">
        <div class="nav">
          <a href="../index.html">Beranda</a>
          <a href="profil.html">Profil</a>
          <a href="galeri.html">Galeri</a>
          <a href="artikel.html">Artikel</a>
          <a href="kontak.html">Kontak</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="card" style="margin-bottom: 14px;">
        <h2>Galeri Foto</h2>
        <p>Berikut beberapa contoh foto yang menggunakan gambar dari folder asset.</p>
      </section>

      <section class="gallery" aria-label="Galeri foto">
        <figure>
          <img src="../asset/mountain.jpg" alt="Foto gunung" />
          <figcaption>Gunung - Langit Luas</figcaption>
        </figure>
        <figure>
          <img src="../asset/bali.jpg" alt="Foto pemandangan Bali" />
          <figcaption>Bali - Warna yang Menarik</figcaption>
        </figure>
        <figure>
          <img src="../asset/food.jpg" alt="Foto makanan" />
          <figcaption>Makanan - Fokus dan Detail</figcaption>
        </figure>
        <figure>
          <img src="../asset/art.jpg" alt="Foto karya seni" />
          <figcaption>Karya Seni - Komposisi Unik</figcaption>
        </figure>
      </section>

      <section class="card" style="margin-top: 14px;">
        <h3>Tips singkat</h3>
        <p>
          Coba gunakan rule of thirds (sepertiga) untuk komposisi, dan pastikan subjek
          terlihat jelas.
        </p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      © 2026 - Galeri Fotografi Sederhana
    </div>
  </footer>
</body>
</html>
